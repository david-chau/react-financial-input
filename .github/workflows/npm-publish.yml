name: Publish to npm

# Publishing on every push to main fails with a 403 the moment the version is
# unchanged, which is what the previous workflow did. A release is the event
# that actually means "ship this".
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for npm Trusted Publishing (OIDC) and for provenance.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check the tarball contents
        run: npm publish --dry-run

      # No NODE_AUTH_TOKEN. Authentication is OIDC against the trusted publisher
      # configured on npmjs.com, and provenance is attached automatically.
      - run: npm publish
