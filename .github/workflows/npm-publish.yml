# Automated releases.
#
# release-please keeps an open "chore(main): release x.y.z" PR, built from the
# Conventional Commit messages landed on main. Merging that PR bumps the
# version, writes CHANGELOG.md, tags, creates the GitHub Release — and this
# same workflow then publishes to npm.
#
# Publishing lives here rather than in a separate `on: release` workflow
# because a Release created with GITHUB_TOKEN does not trigger further
# workflows. Doing both in one run avoids needing a PAT.
#
# The filename matters: npm's trusted publisher for this package is pinned to
# `npm-publish.yml`. Renaming this file breaks OIDC until npm is updated too.
name: Publish to npm

on:
  push:
    branches: [main]
  # Escape hatch: a Release published by hand also publishes. A Release created
  # by GITHUB_TOKEN cannot trigger this, so it only fires for a human or a PAT
  # — which is exactly when you want it.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.2.1. Blank runs release-please only.'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # Nothing to work out when publishing an existing tag directly.
    if: >-
      ${{ github.event_name != 'release' &&
      !(github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # always(), because release-please is skipped on the release event and a
    # skipped dependency would otherwise skip this job too.
    if: >-
      ${{ always() &&
      (needs.release-please.outputs.release_created == 'true' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      # Required for npm Trusted Publishing (OIDC) and provenance.
      id-token: write
      contents: read
    steps:
      # A dispatched tag that does not exist otherwise fails inside
      # actions/checkout as "git failed with exit code 1", three retries deep,
      # with no mention of the tag. That is what a premature manual run of this
      # workflow looks like, and it took reading the raw log to see why.
      - name: The tag must exist
        if: ${{ github.event.inputs.tag != '' }}
        run: |
          if ! git ls-remote --exit-code --tags \
            "https://github.com/${{ github.repository }}" \
            "refs/tags/${{ github.event.inputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ github.event.inputs.tag }} does not exist." \
              "Publishing follows a release: merge the release pull request," \
              "which tags and publishes on its own. Dispatch a tag here only" \
              "to re-publish one that already exists."
            exit 1
          fi

      # The version bump is a commit release-please just pushed, so check out
      # the tag rather than the commit that triggered this run.
      - uses: actions/checkout@v5
        with:
          ref: >-
            ${{ github.event.inputs.tag ||
            github.event.release.tag_name ||
            needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --dry-run

      # No NODE_AUTH_TOKEN. Authentication is OIDC against the trusted
      # publisher configured on npmjs.com; provenance is attached automatically.
      - run: npm publish
